---
name: Lint

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  perl-syntax:
    name: Perl syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Perl dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            perl \
            libwww-perl \
            liblwp-protocol-https-perl \
            libjson-perl \
            libio-socket-ssl-perl

      - name: Syntax check
        run: perl -c PowerStorePlugin.pm

      - name: Check for TODO/FIXME markers (informational)
        run: grep -rn 'TODO\|FIXME\|HACK\|XXX' PowerStorePlugin.pm || true

  shellcheck:
    name: Shell script lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck

      - name: Lint install.sh
        run: shellcheck install.sh || true

      - name: Lint tools/
        run: find tools/ -name '*.sh' -exec shellcheck {} \; || true
